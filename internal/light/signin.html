<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in to your files</title>
<style>
:root { --bg: #f6f7f9; --panel: #fff; --ink: #1b1f24; --muted: #66707c; --line: #e3e6ea; --info: #3b6fd8; --bad: #d64545; }
@media (prefers-color-scheme: dark) { :root { --bg: #111418; --panel: #1a1e24; --ink: #e6e9ed; --muted: #8f99a5; --line: #2a3038; --info: #79a2f2; --bad: #f07070; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 440px; margin: 0 auto; padding: 56px 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 8px; }
p { margin: 8px 0; }
.sub { color: var(--muted); font-size: 14px; }
button { font: inherit; font-weight: 600; width: 100%; padding: 12px; margin-top: 16px; border-radius: 8px; border: 0; background: var(--info); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
label { display: block; font-size: 14px; color: var(--muted); margin-top: 16px; }
input { display: block; width: 100%; font: inherit; padding: 10px 12px; margin-top: 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button.plain { background: none; color: var(--info); border: 1px solid var(--line); font-weight: 500; }
#msg { min-height: 1.5em; margin-top: 12px; color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Your mail and files</h1>
    <form id="pwForm">
      <label for="login">Your email address</label>
      <input id="login" type="email" autocomplete="username" required>
      <label for="pw" id="pwLabel">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div id="newBox" hidden>
        <p class="sub">That was a temporary password. Choose your own now: at least 10 characters. A few words together is easy to remember.</p>
        <label for="new">Your new password</label>
        <input id="new" type="password" autocomplete="new-password">
        <label for="new2">Type it again</label>
        <input id="new2" type="password" autocomplete="new-password">
      </div>
      <button id="pwGo" type="submit">Sign in</button>
    </form>
    <div id="msg" role="status"></div>
    <button id="go" class="plain">Sign in with a passkey instead</button>
    <div id="groupBox" hidden><button class="plain" id="group">Made your passkey at <span id="groupHost">the group's login</span>? Sign in there</button></div>
  </div>
  <p class="sub" style="margin-top:16px">First time? Use the temporary password the group's admin gave you. Forgotten your password? Ask them for a new one.</p>
</main>
<script>
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const base = "/files/light";
// Signed in: on to my. as well (next), back to the app that asked (the
// group's login page), or the files.
const done = d => { location.href = d.next || (location.pathname.startsWith("/login/") ? location.href : d.home || "/files"); };
// With a password: a temporary one is swapped for their own (428 asks).
let choosing = false;
document.getElementById("pwForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("pwGo"), v = id => document.getElementById(id).value;
  msg.textContent = "";
  const body = {login: v("login").trim(), password: v("pw")};
  if (choosing) {
    if (v("new").length < 10) { msg.textContent = "Choose a password of at least 10 characters."; return; }
    if (v("new") !== v("new2")) { msg.textContent = "The two new passwords aren't the same. Type them again."; return; }
    body.new = v("new");
  }
  btn.disabled = true;
  try {
    const r = await fetch(base + "/password", {method: "POST", headers: {"Content-Type": "application/json", "X-Yggstore": "1"}, body: JSON.stringify(body)});
    if (r.status === 428) {
      choosing = true;
      document.getElementById("newBox").hidden = false;
      document.getElementById("pwGo").textContent = "Save my password and sign in";
      document.getElementById("new").focus();
    } else if (!r.ok) {
      throw new Error((await r.text()).trim() || "not signed in (" + r.status + ")");
    } else {
      done(await r.json());
      return;
    }
  } catch (e) { msg.textContent = e.message; }
  btn.disabled = false;
});
async function signIn() {
  const msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!window.PublicKeyCredential) { msg.textContent = "This browser can't use passkeys. Try an up-to-date Chrome, Safari, Edge or Firefox."; return; }
  go.disabled = true; msg.textContent = "";
  try {
    const ch = await (await fetch(base + "/challenge", {cache: "no-store"})).json();
    const cred = await navigator.credentials.get({publicKey: {challenge: unb64(ch.challenge), rpId: ch.rp, userVerification: "preferred", timeout: 120000}});
    const r = await fetch(base + "/signin", {method: "POST", headers: {"Content-Type": "application/json", "X-Yggstore": "1"}, body: JSON.stringify({
      challenge: ch.challenge, id: cred.id, client_data: b64(cred.response.clientDataJSON), auth_data: b64(cred.response.authenticatorData),
      signature: b64(cred.response.signature), user_handle: cred.response.userHandle ? b64(cred.response.userHandle) : ""})});
    if (!r.ok) throw new Error((await r.text()).trim() || "not signed in (" + r.status + ")");
    done(await r.json());
  } catch (e) {
    msg.textContent = e.name === "NotAllowedError" ? "Signing in was cancelled, or this device has no passkey for your files." : e.message;
  }
  go.disabled = false;
}
document.getElementById("go").addEventListener("click", signIn);
// At someone's own address, after my. said it doesn't know this browser:
// a passkey made at my. signs in there instead.
if (location.pathname.startsWith("/files/login")) {
  const iss = new URLSearchParams(location.search).get("iss");
  if (iss) document.getElementById("groupHost").textContent = iss.replace(/^https:\/\//, "");
  document.getElementById("groupBox").hidden = false;
  document.getElementById("group").addEventListener("click", () => { location.href = "/files/login/start"; });
}
// Browser keys are gone (2026-10-23): forget any this browser kept.
try { indexedDB.deleteDatabase("yggstore"); } catch (e) {}
</script>
</body>
</html>
