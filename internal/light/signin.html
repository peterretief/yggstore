<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in to your files</title>
<style>
:root { --bg: #f6f7f9; --panel: #fff; --ink: #1b1f24; --muted: #66707c; --line: #e3e6ea; --info: #3b6fd8; --bad: #d64545; }
@media (prefers-color-scheme: dark) { :root { --bg: #111418; --panel: #1a1e24; --ink: #e6e9ed; --muted: #8f99a5; --line: #2a3038; --info: #79a2f2; --bad: #f07070; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 440px; margin: 0 auto; padding: 56px 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 8px; }
p { margin: 8px 0; }
.sub { color: var(--muted); font-size: 14px; }
button { font: inherit; font-weight: 600; width: 100%; padding: 12px; margin-top: 16px; border-radius: 8px; border: 0; background: var(--info); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
label { display: block; font-size: 14px; color: var(--muted); margin-top: 16px; }
input { display: block; width: 100%; font: inherit; padding: 10px 12px; margin-top: 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button.plain { background: none; color: var(--info); border: 1px solid var(--line); font-weight: 500; }
#msg { min-height: 1.5em; margin-top: 12px; color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Your files</h1>
    <p class="sub">Sign in with the passkey you made on this phone or computer: your fingerprint, face or screen lock. There's no password.</p>
    <div id="keyBox" hidden>
      <label for="pin" id="pinLabel">Your PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="64">
      <div id="pin2Box" hidden>
        <label for="pin2">Type it again</label>
        <input id="pin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="64">
      </div>
      <button id="keyGo">Sign in</button>
    </div>
    <button id="go">Sign in</button>
    <div id="msg" role="status"></div>
  </div>
  <p class="sub" style="margin-top:16px">First time? Open the invite link the box's owner sent you. Lost your passkey? Ask them for a new invite.</p>
</main>
<script>
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const base = "/files/light";
async function signIn() {
  const msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!window.PublicKeyCredential) { msg.textContent = "This browser can't use passkeys. Try an up-to-date Chrome, Safari, Edge or Firefox."; return; }
  go.disabled = true; msg.textContent = "";
  try {
    const ch = await (await fetch(base + "/challenge", {cache: "no-store"})).json();
    const cred = await navigator.credentials.get({publicKey: {challenge: unb64(ch.challenge), rpId: ch.rp, userVerification: "preferred", timeout: 120000}});
    const r = await fetch(base + "/signin", {method: "POST", headers: {"Content-Type": "application/json", "X-Yggstore": "1"}, body: JSON.stringify({
      challenge: ch.challenge, id: cred.id, client_data: b64(cred.response.clientDataJSON), auth_data: b64(cred.response.authenticatorData),
      signature: b64(cred.response.signature), user_handle: cred.response.userHandle ? b64(cred.response.userHandle) : ""})});
    if (!r.ok) throw new Error((await r.text()).trim() || "not signed in (" + r.status + ")");
    location.href = "/files";
  } catch (e) {
    msg.textContent = e.name === "NotAllowedError" ? "Signing in was cancelled, or this device has no passkey for your files." : e.message;
  }
  go.disabled = false;
}
document.getElementById("go").addEventListener("click", signIn);
// A browser key (for a device that can't make a passkey) is kept here, in
// this site's own storage, where it can't be copied out.
function idb(mode, f) {
  return new Promise((ok, bad) => {
    const o = indexedDB.open("yggstore", 1);
    o.onupgradeneeded = () => o.result.createObjectStore("keys");
    o.onerror = () => bad(o.error);
    o.onsuccess = () => {
      const tx = o.result.transaction("keys", mode), r = f(tx.objectStore("keys"));
      tx.oncomplete = () => ok(r && r.result); tx.onerror = () => bad(tx.error);
    };
  });
}
const keyMsg = ch => new TextEncoder().encode("yggstore browser key\n" + location.origin + "\n" + ch);
// With a key kept in this browser, sign in with it and its PIN (which the
// box checks). A key made before PINs is given one the first time.
let key = null, choosing = false;
async function keySignIn() {
  const msg = document.getElementById("msg"), btn = document.getElementById("keyGo");
  const pin = document.getElementById("pin").value;
  msg.textContent = "";
  if (choosing) {
    if (pin.length < 6) { msg.textContent = "Choose a PIN of at least 6 digits or letters."; return; }
    if (pin !== document.getElementById("pin2").value) { msg.textContent = "The two PINs aren't the same. Type them again."; return; }
  } else if (!pin) { msg.textContent = "Type your PIN."; return; }
  btn.disabled = true;
  try {
    const ch = await (await fetch(base + "/challenge", {cache: "no-store"})).json();
    const sig = await crypto.subtle.sign({name: "ECDSA", hash: "SHA-256"}, key.key, keyMsg(ch.challenge));
    const r = await fetch(base + "/signin", {method: "POST", headers: {"Content-Type": "application/json", "X-Yggstore": "1"}, body: JSON.stringify(
      Object.assign({kind: "browser", challenge: ch.challenge, id: key.id, signature: b64(sig), user_handle: key.user}, choosing ? {new_pin: pin} : {pin}))});
    if (r.status === 428) {
      choosing = true;
      document.getElementById("pinLabel").textContent = "Choose a PIN (at least 6 digits or letters). You'll type it to open your files from now on.";
      document.getElementById("pin2Box").hidden = false;
      document.getElementById("pin").value = ""; document.getElementById("pin").autocomplete = "new-password";
      document.getElementById("pin").focus();
      msg.style.color = "inherit"; msg.textContent = "Your files now need a PIN as well as this browser.";
    } else if (!r.ok) {
      throw new Error((await r.text()).trim());
    } else {
      location.href = "/files";
      return;
    }
  } catch (e) { msg.style.color = ""; msg.textContent = e.message; document.getElementById("pin").value = ""; }
  btn.disabled = false;
}
(async () => {
  try { key = await idb("readonly", s => s.get("me")); } catch (e) { return; }
  if (!key) return;
  document.querySelector(".card .sub").textContent = "This browser keeps your key. Type your PIN to open your files.";
  document.getElementById("keyBox").hidden = false;
  const go = document.getElementById("go");
  go.textContent = "Use a passkey instead"; go.className = "plain";
  document.getElementById("keyGo").addEventListener("click", keySignIn);
  document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter" && !choosing) keySignIn(); });
  document.getElementById("pin").focus();
})();
</script>
</body>
</html>
