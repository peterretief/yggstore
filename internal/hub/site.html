<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Your website</title>
<style>
:root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --sub: #5b6475; --line: #dde1e8; --accent: #2f6fde; --ok: #1f8a4c; --bad: #c0392b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --sub: #9aa3b2; --line: #2c323d; --accent: #6b9bff; --ok: #4cc27f; --bad: #ff6b5b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 26px; margin: 0 0 6px; }
.sub { color: var(--sub); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; }
.card h2 { font-size: 17px; margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ok { color: var(--ok); font-weight: 600; }
input { width: 100%; max-width: 22em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
button { padding: 6px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
button.plain { background: transparent; color: var(--accent); border: 1px solid var(--line); }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 10px 0; }
.err { color: var(--bad); margin-top: 10px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Your website</h1>
  <div class="sub">Your page on the web. <a href="/files">Your files</a> · <a href="/files/mail">Your mail</a></div>
  <div class="card" id="siteCard"><span class="sub">Loading…</span></div>
  <div class="card" id="verCard" hidden><h2>Versions</h2>
    <p class="sub">Every change you publish is kept. Going back puts an earlier version online, and in your site's folder; what was in the
      folder is kept on the box.</p><div id="vers"></div></div>
  <div class="err" id="err"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const when = ms => new Date(ms).toLocaleString();
let st;
async function act(op, body) {
  $("err").textContent = "";
  const r = await fetch("?op=" + op, {method: "POST", headers: {"X-Yggstore": "1", "Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  if (!r.ok) { $("err").textContent = (await r.text()).trim(); return false; }
  await load();
  return true;
}
function siteCard() {
  if (!st.name) return `<h2>No website yet</h2><p class="sub">The box's owner can ask the group for a name for you, such as
    <b>yourname.${esc(st.domain || "the-group.org")}</b>. Once the group's admin approves it, your page, its contact form and your
    email address appear here.</p>`;
  const s = st.site;
  const pub = s && s.published ? `<span class="ok">online</span> since ${when(s.published < 1e12 ? s.published * 1000 : s.published)}`
    : `<span class="sub">being put online…</span>`;
  return `<h2><a href="https://${esc(st.name)}/" target="_blank" rel="noopener">${esc(st.name)}</a></h2>
    <p>${pub}${s && s.problem ? `<br><span class="err">${esc(s.problem)}</span>
      <br><button id="keep">Keep the site as it is</button> <button class="plain" id="anyway">Publish the change anyway</button>` : ""}</p>
    <p>Your email address is <b>${esc(st.address)}</b>: mail to it comes in to <a href="/files/mail">your mail</a>.</p>
    <p class="sub">To change your page, open <a href="/files">your files</a>, then <b>Your websites</b> and <b>${esc(st.name)}</b>.
      Each change goes online within a minute.</p>
    <p><label><input type="checkbox" id="contact" style="width:auto" ${s && s.contact ? "checked" : ""} ${s ? "" : "disabled"}>
      A contact form on your page</label><br><span class="sub">Visitors write to you without seeing your address; their messages come in to your mail.</span></p>
    ${s ? upCard(s.uploaders || []) : ""}`;
}
function upCard(list) {
  const rows = list.map(a => `<div class="row"><span class="name">${esc(a)}</span>
    <button class="plain" data-unlist="${esc(a)}">Take off</button></div>`).join("");
  return `<h2>Who may add photos</h2>
    <p class="sub">These people can sign in on your site with the group's login and add photos and files to it, if your site has a page for
      that. Anyone visiting can see what's added; you can delete it under <b>Your websites</b>, in its <b>uploads</b> folder.</p>
    ${rows || `<p class="sub">Nobody yet, so nobody can add anything.</p>`}
    <p><input id="upAdd" type="email" placeholder="their address in the group, such as tim@${esc(st.domain || "the-group.org")}">
      <button id="upGo">Add</button></p>`;
}
async function load() {
  try { st = await (await fetch("?op=status", {cache: "no-store"})).json(); }
  catch (e) { $("err").textContent = "The box isn't answering."; return; }
  if (!document.activeElement || document.activeElement.id !== "upAdd") $("siteCard").innerHTML = siteCard();
  if (!st.site) return;
  const r = await fetch("?op=versions", {cache: "no-store"}).catch(() => null);
  const vs = r && r.ok ? await r.json() : [];
  $("verCard").hidden = vs.length < 2;
  const size = n => n >= 1 << 20 ? (n / (1 << 20)).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const cur = vs.findIndex(v => v.current);
  $("vers").innerHTML = (cur >= 0 && cur + 1 < vs.length ? `<p><button data-back="">Go back to the version before</button></p>` : "") +
    vs.map(v => `<div class="row"><span class="name">${when(v.stored_at * 1000)} · ${v.files} file${v.files == 1 ? "" : "s"}, ${size(v.bytes)}</span>
      ${v.current ? `<span class="ok">online now</span>` : `<button class="plain" data-back="${esc(v.id)}">Go back to this one</button>`}</div>`).join("");
}
document.addEventListener("click", async ev => {
  const t = ev.target;
  const list = (st.site && st.site.uploaders) || [];
  if (t.id === "upGo" && $("upAdd").value.trim()) act("uploaders", {list: [...list, $("upAdd").value.trim()]});
  if (t.dataset.unlist) act("uploaders", {list: list.filter(a => a !== t.dataset.unlist)});
  if (t.dataset.back !== undefined && confirm("Put this earlier version online, and in your site's folder?")) act("back", {id: t.dataset.back});
  if (t.id === "keep") act("keep");
  if (t.id === "anyway" && confirm("Publish the change as it is? It replaces the site online.")) act("anyway");
});
document.addEventListener("change", ev => {
  if (ev.target.id === "contact") act("contact", {on: ev.target.checked});
});
load();
setInterval(load, 15000);
</script>
</body>
</html>
