name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/yggstore
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/yggstore
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/yggstore
