# Factory settings for a Raspberry Pi hub: everything it is set up with here,
# on the dev box, before it goes out. Set NAME for each Pi; the rest stays
# the same from one Pi to the next.
#
# The file is read by the shell (KEY=value, no spaces around =; quote values
# that have spaces).

# --- This Pi -----------------------------------------------------------------

# The Pi's one name: its name on the network (NAME.local), its node's name in
# the group, and its hub's name, shown to users on its page and in Syncthing.
# Letters, digits and dashes.
NAME=localbox-003

# The person the Pi's space and uploads count towards in the group.
OWNER=peter

# --- The Pi on the bench ----------------------------------------------------

# How the dev box reaches the Pi on the bench. A drive written with
# scripts/flash-pi.sh gives the Pi its NAME and lets the dev box in as root.
# (From Raspberry Pi Imager instead: the user and name set there, such as
# pi@raspberrypi.local.)
PI_SSH=root@$NAME.local

# --- Wi-Fi --------------------------------------------------------------------

# The Wi-Fi network the Pi joins, for a Pi without a network cable (a Pi
# Zero 2 W). Leave WIFI_SSID empty for a Pi on a cable. The password is put
# on the drive hashed, not as typed. WIFI_COUNTRY is the two-letter country
# code, which sets the channels it may use.
WIFI_SSID=""
WIFI_PASSWORD=""
WIFI_COUNTRY=ZA

# --- Its storage ------------------------------------------------------------

# Where the node keeps the group's shards: "sd" on the drive it boots from,
# or "usb" on a USB stick plugged into the Pi (on a Pi Zero, through an OTG
# adapter). With "usb", scripts/provision-pi.sh formats the stick, after
# asking, unless it is already the Pi's yggstore stick.
STORAGE=sd

# --- The group --------------------------------------------------------------

# There is one group: the one this dev box's dashboard is the admin of. The
# Pi joins it with an invite made on that dashboard, which brings the group's
# name and its members with it.
GROUP="peter's group"
ADMIN_DASHBOARD=http://127.0.0.1:7480
# SSH over Yggdrasil is let in only from this machine (its Yggdrasil
# address). To allow another admin machine instead, give its address:
# ADMIN_YGG=200:...

# --- The node ---------------------------------------------------------------

# Disk space the Pi gives the group, in GB (localbox-001 gives 40).
QUOTA_GB=40

# Whether it also holds paying customers' files, stored through the group's
# gateway (yes or no).
CUSTOMERS=no

# --- The hub ----------------------------------------------------------------

# How many devices may pair with the hub in a day (0 for no limit).
PAIR_LIMIT=5

# Websites the hub keeps, synced with its devices and published when they
# change: domains, separated by spaces ("" for none). Each must be published
# once from the Pi first (see docs/hub.md, Websites).
SITES=""

# The most a website may hold, in MB.
SITE_MAX_MB=500
