# localbox-004: an HP t630 thin client (AMD GX-420GI, 8 GB, 32 GB SSD) on
# Ubuntu Server 26.04, set up with scripts/provision-pi.sh factory/t630.conf.
# It is to become the group's always-on admin box; for now, a member.
NAME=localbox-004
OWNER=peter
# By address: it gets one by DHCP and has no .local name until Avahi runs.
PI_SSH=peter@192.168.0.5
WIFI_SSID=""
WIFI_PASSWORD=""
WIFI_COUNTRY=ZA
# The shards stay on the internal SSD (about 20 GB free).
STORAGE=sd
GROUP="peter's group"
ADMIN_DASHBOARD=http://127.0.0.1:7480
QUOTA_GB=10
CUSTOMERS=no
PAIR_LIMIT=5
SITES=""
SITE_MAX_MB=500
